<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>VersusAI</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@600;700&display=swap');

:root{
  --red:#E60000;
  --red-deep:#B30000;
  --glass:rgba(255,255,255,.08);
  --glass-border:rgba(255,255,255,.18);
}

*{ box-sizing:border-box; }

/* ---------- BACKGROUND (photo removed, Vodacom black) ---------- */
html{
  background-color:#0d0d0d;
}

/* ---------- PAGE LAYOUT ---------- */
body{
  color:#fff;
  font-family:'Inter',sans-serif;
  max-width:1200px;
  margin:0 auto;
  padding:40px 24px 60px;
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
  grid-template-areas:
    "title title title"
    "sub   sub   sub"
    "s1    vs    s2"
    "p1    .     p2"
    "go    go    go"
    "c1    .     c2"
    "msg   msg   msg"
    "form  form  form";
  column-gap:24px;
  row-gap:18px;
  align-items:start;
}

/* ---------- BACKGROUND VIDEO + OVERLAY ---------- */
#bgVideo{
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
  z-index:-2;
}
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  background:
    radial-gradient(circle at 50% 0%, rgba(230,0,0,.35), transparent 55%),
    linear-gradient(#1a1a1a, #000);
}

/* ---------- HEADINGS ---------- */
.h1{
  grid-area:title;
  margin:0;
  text-align:center;
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-weight:700;
  font-size:clamp(2rem,5vw,3.4rem);
  text-shadow:0 4px 24px rgba(230,0,0,.6);
  list-style:none;
  text-decoration:none;
}
p{
  grid-area:sub;
  margin:0 0 14px;
  text-align:center;
  color:#fff;
  opacity:.8;
  font-family:'Inter',sans-serif;
  font-weight:400;
  font-size:1.05rem;
  line-height:1.6;
}
#store{ display:none; } /* the "shop" placeholder text */

/* ---------- SEARCH INPUTS ---------- */
#search,#search2{
  width:100%;
  height:56px;
  padding:0 20px;
  border-radius:14px;
  border:3px solid var(--red);
  background:#fff;
  color:#111;
  font-family:'Inter',sans-serif;
  font-size:18px;
  font-weight:600;
  outline:none;
  box-shadow:0 0 0 2px #fff, 0 6px 20px rgba(230,0,0,.45);
  transition:border-color .2s, box-shadow .2s;
}
#search{ grid-area:s1; }
#search2{ grid-area:s2; }
#search::placeholder,#search2::placeholder{
  color:#777;
  font-weight:400;
}
#search:focus,#search2:focus{
  border-color:var(--red-deep);
  box-shadow:0 0 0 2px #fff, 0 0 0 6px rgba(230,0,0,.5);
}

/* ---------- VS BADGE ---------- */
h2{
  grid-area:vs;
  align-self:center;
  margin:0;
  width:56px;
  height:56px;
  border-radius:50%;
  border:3px solid #fff;
  background:var(--red);
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-size:20px;
  font-weight:700;
  display:flex;
  justify-content:center;
  align-items:center;
  box-shadow:0 0 24px rgba(230,0,0,.8);
}

/* ---------- BUTTONS ---------- */
#pick1,#pick2{
  height:46px;
  min-width:170px;
  padding:0 24px;
  border-radius:999px;
  border:2px solid #fff;
  background:var(--red);
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  justify-self:center;
  box-shadow:0 6px 18px rgba(230,0,0,.5);
  transition:background .2s, color .2s, transform .2s;
}
#pick1{ grid-area:p1; }
#pick2{ grid-area:p2; }
#pick1:hover,#pick2:hover{
  background:#fff;
  color:var(--red);
  transform:translateY(-2px);
}

#submit{
  grid-area:go;
  justify-self:center;
  height:56px;
  padding:0 44px;
  margin-top:6px;
  border:none;
  border-radius:999px;
  background-color:var(--red);
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:18px;
  font-weight:700;
  letter-spacing:.5px;
  cursor:pointer;
  box-shadow:0 8px 28px rgba(230,0,0,.55);
  transition:transform .2s, box-shadow .2s, background-color .2s;
}
#submit:hover{
  background-color:var(--red-deep);
  transform:translateY(-3px) scale(1.03);
  box-shadow:0 12px 34px rgba(230,0,0,.7);
}
#submit:active{ transform:translateY(0) scale(.98); }

/* ---------- RESULT CARDS ---------- */
#seaction1,#seaction2{
  display:flex;
  flex-direction:column;
  align-items:center;
  align-self:stretch;
  gap:14px;
  padding:24px;
  border-radius:20px;
  border:1px solid var(--glass-border);
  border-top:4px solid var(--red);
  background:var(--glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
}
#seaction1{ grid-area:c1; }
#seaction2{ grid-area:c2; }

#IstPhoto,#IIndPhoto{
  display:block;
  flex:0 0 auto;
  width:100%;
  max-width:260px;
  height:auto;
  aspect-ratio:1 / 1;
  object-fit:cover;
  border-radius:16px;
  border:2px solid var(--red);
  box-shadow:0 8px 24px rgba(0,0,0,.5);
}
#IstPhoto[src=""],#IIndPhoto[src=""]{ display:none; } /* hides the broken image before a search */

#info1:empty,#info2:empty{ display:none; }

#fire1,#fire2{
  flex:0 0 auto;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
  min-height:3em;
  font-family:'Poppins',sans-serif;
  font-size:22px;
  font-weight:600;
  color:#fff;
  text-align:center;
  text-transform:capitalize;
}
#fire1 div,#fire2 h3{
  margin:0;
  font-size:inherit;
  font-weight:inherit;
}

.percentage1,.percentage2{
  flex:0 0 auto;
  width:100%;
  max-width:220px;
  text-align:center;
  padding:8px 24px;
  border-radius:999px;
  background:var(--red);
  color:white;
  font-family:'Poppins',sans-serif;
  font-size:18px;
  font-weight:700;
}

.column1,.column2,
.vodacom1,.vodacom2{
  display:block;
  width:100%;
  padding:16px 18px;
  border-radius:14px;
  border-left:4px solid var(--red);
  background:rgba(0,0,0,.45);
  color:#eee;
  font-family:'Inter',sans-serif;
  font-size:19px;
  line-height:1.65;
  text-align:left;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.column1:empty,.column2:empty,
.vodacom1:empty,.vodacom2:empty{ display:none; }

/* ---------- VERDICT MESSAGE ---------- */
#message{
  grid-area:msg;
  min-height:1.5em;
  margin-top:6px;
  text-align:center;
  color:#fff;
  font-family:'Poppins',sans-serif;
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:700;
  text-shadow:0 4px 20px var(--red);
}

/* ---------- CHOICE FORM (shows below the results after pick) ---------- */
#form{
  grid-area:form;
  justify-self:center;
  width:100%;
  max-width:520px;
  display:none;              /* hidden until the person clicks option1 / option2 */
  flex-direction:column;
  gap:10px;
  padding:28px;
  border-radius:20px;
  border:1px solid var(--glass-border);
  border-top:4px solid var(--red);
  background:var(--glass);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 12px 40px rgba(0,0,0,.4);
}
#form.show{ display:flex; }
#formTitle{
  margin:0 0 8px;
  text-align:center;
  font-family:'Poppins',sans-serif;
  font-size:1.4rem;
  font-weight:700;
  text-shadow:0 4px 20px rgba(230,0,0,.6);
}
#form label{
  font-size:14px;
  font-weight:600;
  opacity:.85;
}
#form input{
  height:48px;
  padding:0 16px;
  border-radius:12px;
  border:2px solid var(--red);
  background:#fff;
  color:#111;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:600;
  outline:none;
  transition:box-shadow .2s;
}
#form input::placeholder{ color:#777; font-weight:400; }
#form input:focus{ box-shadow:0 0 0 4px rgba(230,0,0,.4); }
#form input[readonly]{
  background:#f1f1f1;
  color:var(--red-deep);
}
.choisen{
  height:50px;
  margin-top:8px;
  border:none;
  border-radius:999px;
  background:var(--red);
  color:#fff;
  font-family:'Inter',sans-serif;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 24px rgba(230,0,0,.5);
  transition:transform .2s, background-color .2s;
}
.choisen:hover{ background:var(--red-deep); transform:translateY(-2px); }
.choisen:disabled{ opacity:.6; cursor:not-allowed; }
#formMsg{
  min-height:1.4em;
  text-align:center;
  font-weight:600;
}

/* ---------- PHONES / SMALL SCREENS ---------- */
@media (max-width:820px){
  body{
    grid-template-columns:minmax(0,1fr);
    grid-template-areas:
      "title" "sub"
      "s1" "p1"
      "vs"
      "s2" "p2"
      "go"
      "c1" "c2"
      "msg"
      "form";
    padding:28px 16px 48px;
  }
  h2{ justify-self:center; }
}
</style>
</head>

//==================A Small form for submiting a email===================//

const form = document.getElementById("form");
const formTitle = document.getElementById("formTitle");
const formMsg = document.getElementById("formMsg");
const fnameBox = document.querySelector(".name");
const surname = document.querySelector(".surname");
const choisen = document.querySelector(".choisen");
const phone = document.querySelector(".phone");
const email = document.querySelector(".email");

// show the form and put the picked device inside the phone box (fphone)
function openForm(device){
  if(!device){
    message.textContent = "type a device first, then pick it";
    return;
  }
  phone.value = device;
  formTitle.textContent = `You picked: ${device}`;
  formMsg.textContent = "";
  form.classList.add("show");
  form.scrollIntoView({ behavior:"smooth", block:"center" });
}

pick1.addEventListener("click",()=>{
  openForm(search.value.trim());
});

pick2.addEventListener("click",()=>{
  openForm(search2.value.trim());
});

// send the form (values are read at click time, so they are never empty by mistake)
choisen.addEventListener("click",async()=>{
  const fname = fnameBox.value.trim();
  const fsurname = surname.value.trim();
  const femail = email.value.trim();
  const fphone = phone.value.trim();

  if(!fname || !fsurname || !femail || !fphone){
    console.log("the boxies are empty");
    formMsg.textContent = "please fill all the boxes";
    return;
  }

  choisen.disabled = true;
  formMsg.textContent = "sending...";

  try{
    const response = await fetch("/form/v2",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        fname,fsurname,femail,fphone
      })
    });

    const data = await response.json();
    formMsg.textContent = data.message;

    if(!response.ok){
      throw new Error("unsuccessful form");
    }

    console.log("saved saved successful");
    message.textContent = "you interest have been received at the front desk ";

    fnameBox.value = "";
    surname.value = "";
    email.value = "";
  }
  catch(error){
    console.error(error);
  }
  finally{
    choisen.disabled = false;
  }
});
